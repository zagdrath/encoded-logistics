name: Release

# Pushing a version tag (git tag -a v1.0.0 -m "Encoded Logistics 1.0.0" && git push origin v1.0.0) builds that
# commit, checks it, and publishes a GitHub Release with the jar and that version's changelog section.
# A tag with a pre-release part (v1.1.0-beta.1) is published as a pre-release. See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The tag must match mod_version, so v1.1.0 can't ship a jar built as 1.0.0.
      - name: Check the tag matches mod_version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          minecraft_version="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "Tag: ${GITHUB_REF_NAME}, mod_version: ${mod_version}"
          if [ "${tag_version}" != "${mod_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match mod_version=${mod_version} in gradle.properties"
            exit 1
          fi
          echo "VERSION=${mod_version}" >> "$GITHUB_ENV"
          echo "JAR=build/libs/encodedlogistics-${mod_version}+${minecraft_version}.jar" >> "$GITHUB_ENV"

      # The release notes are the version's section of CHANGELOG.md, which must be dated, without its
      # "Suggested version" line, with an Unreleased section above it and with its compare links.
      - name: Check CHANGELOG.md and extract release notes
        run: |
          bash .github/scripts/release-notes.sh "${VERSION}" CHANGELOG.md release-notes.md
          cat release-notes.md

      - name: Build
        run: ./gradlew build

      - name: Run game tests
        run: ./gradlew runGameTestServer

      - name: Check the jar was built
        run: |
          if [ ! -f "${JAR}" ]; then
            echo "::error::${JAR} wasn't built; build/libs has:"
            ls build/libs
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${VERSION}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" "${JAR}" \
            --title "Encoded Logistics ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}"
