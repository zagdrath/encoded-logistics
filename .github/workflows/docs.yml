name: Docs

# Rebuilds the documentation site and runs its checks on every push: the data export (a headless server), the ELCL
# example compile test, and the site build with its link, anchor, coverage and mention checks. Icons need a game
# window, so CI uses the ones committed in docs/site/assets/icons (renderDocsIcons is left out when CI is set).
on: [push, pull_request]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build the documentation site and run its checks
        run: ./gradlew buildDocs -PskipDocsIcons -Pdocs_python=python3 --console=plain

      - name: Build report
        if: always()
        run: cat build/docs/build-report.md || true

      # The site is committed, ready to upload: say so when this push's code would change it.
      - name: Is the committed site up to date?
        run: |
          if ! git diff --quiet -- docs/site docs/site-src/data docs/site-src/SCREENSHOTS_NEEDED.md docs/terminal-os-elcl.html; then
            echo "::warning::The committed documentation is out of date: run ./gradlew buildDocs and commit docs/site and docs/site-src/data."
            git diff --stat -- docs/site docs/site-src/data | tail -20
          fi

      - name: Upload the built site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-${{ github.sha }}
          path: docs/site
          retention-days: 14
