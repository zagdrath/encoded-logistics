license="${mod_license}"
issueTrackerURL="https://github.com/zagdrath/encoded-logistics/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/encoded-logistics"

# Square icon in the mod list, banner on the mod details screen (files in the root of the mod jar). The art is
# pixel art, so the icon isn't blurred when it's scaled.
iconFile="encodedlogistics_icon.png"
iconBlur=false
bannerFile="encodedlogistics_banner.png"

credits="Speakers' MP3 decoding by JLayer (JavaZOOM), under the GNU LGPL 2.1, carried in the jar with its licence (META-INF/licenses/jlayer-LGPL-2.1.txt)."
authors="Zagdrath"
description='''
Your base on the mainframe: storage networks and automation with server racks, servers and a scriptable terminal operating system.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Arcforge: the Small Wireless Bridge's machines. Any version loads; without its machine control API (Arcforge 2.5.0+),
# or with an API of another major version, the integration is off and the log says why (ArcforgeCompat).
[[dependencies.${mod_id}]]
    modId="arcforge"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
